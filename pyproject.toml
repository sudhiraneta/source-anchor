[project]
name = "source-anchor"
version = "0.1.0"
description = "Tavily research agent whose claims are anchored to returned passages and primary sources"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-nebius>=0.1.0",
    "tavily-python>=0.7.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
